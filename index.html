<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fav.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>folat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
       *, *::before, *::after { box-sizing: border-box; margin: 0; }
       html, body { height: 100%; }
       body { font-family: 'Roboto', system-ui, sans-serif; background: #f9fafb; }

      .app-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: linear-gradient(135deg, #1a2744 0%, #1e2d4d 40%, #0f1a2e 100%);
      }

      .app-loader .logo-wrap {
        display: flex; flex-direction: column; align-items: center; gap: 20px;
      }

      .app-loader .logo {
        width: 80px; height: 80px; border-radius: 16px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        display: grid; place-items: center;
        box-shadow: 0 8px 32px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.2);
        border: 1px solid rgba(255,255,255,0.15);
      }

      .app-loader .logo img { width: 52px; height: 52px; object-fit: contain; }

      .app-loader .brand {
        text-align: center;
      }
      .app-loader .brand-name {
        font-size: 28px; font-weight: 900; color: #fff;
        letter-spacing: 1.5px; text-transform: uppercase;
      }
      .app-loader .brand-tag {
        font-size: 12px; color: rgba(255,255,255,0.55);
        letter-spacing: 3px; text-transform: uppercase; margin-top: 4px;
      }

      .app-loader .track {
        margin-top: 32px; width: 140px; height: 3px;
        background: rgba(255,255,255,0.12); border-radius: 99px; overflow: hidden;
      }
      .app-loader .fill {
        height: 100%; width: 40%;
        background: linear-gradient(90deg, #3acc7f, #1db064);
        border-radius: 99px;
        animation: slide 1.3s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }

      .app-loader .status {
        margin-top: 14px; color: rgba(255,255,255,0.45);
        font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
      }

      #root { min-height: 100vh; background: #f9fafb; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="logo-wrap">
          <div class="logo">
            <img src="/logo.png" alt="FOLAT" />
          </div>
          <div class="brand">
            <div class="brand-name">FOLAT</div>
            <div class="brand-tag">Financial Management</div>
          </div>
          <div class="track"><div class="fill"></div></div>
          <div class="status">Loading</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
